name: Run library migrations on Hetzner

# Manual trigger only. The migrations rewrite hundreds of thousands of rows
# and take 30-90 minutes; do not run on every push. Workflow_dispatch lets
# you pick which migration to run from the Actions tab UI.

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Which migration to run'
        required: true
        type: choice
        default: 'all'
        options:
          - all                       # full chain: fingerprints → containment → indexer
          - fingerprints               # rewrite contentFingerprint + canonicalGroupKey
          - containment                # collapse same-article variant clusters
          - indexer                    # populate cards_vec via OpenRouter embeddings
          - dry-run-fingerprints       # preview only, no DB writes
          - dry-run-containment        # preview only, no DB writes
          - vacuum                     # offline-VACUUM the prod DB (~30-60 min, brief downtime)
          - cleanup                    # delete orphan vacuum-new file + restart pm2
          - disk-audit                 # READ-ONLY: list biggest files/dirs eating space
          - free-disk                  # delete known-safe junk (logs, npm cache, etc.) — prints before/after
          - relocate-db-to-volume      # one-time: mv library.db to /mnt/volume + symlink (~10 min downtime)
          - purge-backfiles            # DESTRUCTIVE: delete all of /mnt/volume/backfiles/ (~23GB)

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: SSH + run selected migration
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Migrate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 240m
          script: |
            set -e
            cd ${{ secrets.SERVER_PATH }}
            echo "── Pulling main (so migration scripts are current) ──"
            git fetch origin main && git reset --hard origin/main

            STEP="${{ inputs.step }}"
            echo "── Running step: $STEP ──"

            run_fp()       { node server/scripts/migrateFingerprints.js --commit; }
            run_cont()     { node server/scripts/migrateContainment.js  --commit; }
            run_idx()      { node server/scripts/indexCardsVec.js; }
            run_fp_dry()   { node server/scripts/migrateFingerprints.js; }
            run_cont_dry() { node server/scripts/migrateContainment.js;  }
            run_vacuum() {
              # VACUUM INTO writes to /mnt/volume (40GB volume) instead of the
              # tight root partition (38GB, only ~8GB free with the 22GB DB).
              # After VACUUM completes there, mv the result back to server/data.
              # Stop pm2 so writes during the copy aren't lost. Downtime is
              # the copy + cross-mount move (~30-90 min).
              local DB="server/data/library.db"
              local VOL="/mnt/volume/verba-vacuum"
              local NEW="$VOL/library.db.vacuum-new"
              local BAK="$DB.bak-$(date +%Y%m%d-%H%M)"
              mkdir -p "$VOL"
              echo "── Stopping pm2 to prevent writes during vacuum ──"
              pm2 stop ${{ secrets.PM2_PROCESS_NAME }} || true
              echo "── Pre-vacuum size: $(du -h "$DB" | cut -f1) ──"
              echo "── Disk before vacuum ──"
              df -h server/data/ /mnt/volume || true
              rm -f "$NEW"
              echo "── Running VACUUM INTO ($NEW) ──"
              local T0=$(date +%s)
              node -e "
                const Database = require('better-sqlite3');
                const db = new Database('$DB');
                try { require('sqlite-vec').load(db); } catch {}
                db.pragma('journal_mode = WAL');
                db.pragma('wal_checkpoint(TRUNCATE)');
                db.exec(\`VACUUM INTO '$NEW'\`);
                db.close();
                console.log('VACUUM INTO complete');
              "
              local T1=$(date +%s)
              echo "── VACUUM finished in $((T1-T0))s ──"
              echo "── Post-vacuum size: $(du -h "$NEW" | cut -f1) ──"
              echo "── Disk after vacuum ──"
              df -h server/data/ /mnt/volume || true
              echo "── Atomic swap (keeping old as $BAK) ──"
              mv "$DB" "$BAK"
              # Cross-mount mv = copy + delete; takes a minute or two.
              mv "$NEW" "$DB"
              # Aux SQLite files won't match the new main file; remove them
              # so SQLite regenerates from the swapped file.
              rm -f "$DB-wal" "$DB-shm"
              echo "── Restarting pm2 ──"
              pm2 start ${{ secrets.PM2_PROCESS_NAME }} || pm2 restart ${{ secrets.PM2_PROCESS_NAME }} || true
              echo "── Old DB preserved at: $BAK ──"
              echo "── Verify, then delete .bak when comfortable: rm '$BAK' ──"
            }

            case "$STEP" in
              all)
                run_fp
                run_cont
                run_idx
                ;;
              fingerprints)         run_fp ;;
              containment)          run_cont ;;
              indexer)              run_idx ;;
              dry-run-fingerprints) run_fp_dry ;;
              dry-run-containment)  run_cont_dry ;;
              vacuum)               run_vacuum ;;
              purge-backfiles)
                # User-confirmed deletion of /mnt/volume/backfiles/.
                # The zips are already imported into library.db; deleting
                # them only loses the ability to re-import from local
                # archive (re-fetch from opencaselist would be needed).
                echo "── Disk before ──"
                df -h /mnt/volume || true
                echo "── Backfiles size before ──"
                du -sh /mnt/volume/backfiles 2>/dev/null || echo "(no backfiles dir)"
                echo "── Ownership ──"
                ls -ld /mnt/volume /mnt/volume/backfiles 2>/dev/null || true
                echo "── Deleting /mnt/volume/backfiles (try plain, then sudo -n) ──"
                if rm -rf /mnt/volume/backfiles 2>/dev/null; then
                  echo "  plain rm succeeded"
                elif sudo -n rm -rf /mnt/volume/backfiles 2>/dev/null; then
                  echo "  sudo -n rm succeeded"
                else
                  echo "ERR: cannot delete /mnt/volume/backfiles — neither plain rm nor passwordless sudo work."
                  echo "Either chown -R the dir to the SSH user, or configure passwordless sudo for 'rm'."
                  exit 1
                fi
                echo "── Disk after ──"
                df -h /mnt/volume || true
                ;;
              relocate-db-to-volume)
                # One-time structural fix: move library.db from the tight
                # /dev/sda1 (38GB, 8GB free) to /dev/sdb mounted at
                # /mnt/volume (40GB, 15GB free), and symlink it back.
                # Frees ~22GB on root, gives vacuum/import operations
                # plenty of headroom going forward.
                DB="server/data/library.db"
                TARGET_DIR="/mnt/volume/verba"
                TARGET="$TARGET_DIR/library.db"
                if [ -L "$DB" ]; then
                  echo "── $DB is already a symlink → $(readlink -f $DB). Nothing to do. ──"
                  df -h server/data/ /mnt/volume || true
                  exit 0
                fi
                if [ ! -f "$DB" ]; then
                  echo "ERR: $DB not found"; exit 1
                fi
                AVAIL_KB=$(df --output=avail /mnt/volume | tail -1)
                NEED_KB=$(du -k "$DB" | cut -f1)
                # Add 10% buffer
                if [ "$AVAIL_KB" -lt $(( NEED_KB * 11 / 10 )) ]; then
                  echo "ERR: /mnt/volume only has ${AVAIL_KB}K free, need ${NEED_KB}K + 10% buffer"
                  df -h /mnt/volume; exit 1
                fi
                mkdir -p "$TARGET_DIR"
                echo "── Stopping pm2 (no writes during cross-mount mv) ──"
                pm2 stop ${{ secrets.PM2_PROCESS_NAME }} || true
                echo "── Checkpointing WAL ──"
                node -e "
                  const D=require('better-sqlite3');
                  const db=new D('$DB');
                  try{require('sqlite-vec').load(db);}catch{}
                  db.pragma('wal_checkpoint(TRUNCATE)');
                  db.close();
                " || true
                echo "── Disk before mv ──"
                df -h server/data/ /mnt/volume || true
                echo "── mv $DB → $TARGET (cross-mount, ~5-10 min for 22GB) ──"
                T0=$(date +%s)
                mv "$DB" "$TARGET"
                # Aux files are regenerated by SQLite; safest to drop them.
                rm -f "$DB-wal" "$DB-shm"
                T1=$(date +%s)
                echo "── mv finished in $((T1-T0))s ──"
                echo "── Symlink ──"
                ln -s "$TARGET" "$DB"
                ls -lh "$DB" "$TARGET"
                echo "── Disk after mv ──"
                df -h server/data/ /mnt/volume || true
                echo "── Restart pm2 ──"
                pm2 restart ${{ secrets.PM2_PROCESS_NAME }} --update-env || pm2 start ${{ secrets.PM2_PROCESS_NAME }} || true
                pm2 list || true
                echo "── Done. library.db now lives on /mnt/volume; symlink at $DB. ──"
                ;;
              cleanup)
                echo "── Cleaning up failed vacuum artifacts ──"
                df -h server/data/ || true
                ls -lh server/data/library.db.vacuum-new 2>/dev/null || echo "(no orphan vacuum file)"
                rm -f server/data/library.db.vacuum-new
                echo "── Disk after cleanup ──"
                df -h server/data/ || true
                pm2 restart ${{ secrets.PM2_PROCESS_NAME }} --update-env || pm2 start ${{ secrets.PM2_PROCESS_NAME }} || true
                pm2 list || true
                ;;
              disk-audit)
                echo "── df -h ──"
                df -h
                echo
                echo "── server/data/ contents ──"
                du -h --max-depth=1 server/data/ 2>/dev/null | sort -h | tail -20 || true
                echo
                echo "── biggest files in server/data/ ──"
                find server/data/ -maxdepth 2 -type f -size +50M -exec ls -lh {} \; 2>/dev/null | sort -k5 -h | tail -20 || true
                echo
                echo "── /mnt/volume contents (top-level) ──"
                ls -lah /mnt/volume 2>/dev/null || echo "(no /mnt/volume access)"
                echo
                echo "── /mnt/volume du (1 level deep) ──"
                du -h --max-depth=1 /mnt/volume 2>/dev/null | sort -h | tail -20 || true
                echo
                echo "── biggest files anywhere on /mnt/volume ──"
                find /mnt/volume -maxdepth 4 -type f -size +50M -exec ls -lh {} \; 2>/dev/null | sort -k5 -h | tail -20 || true
                echo
                echo "── npm/cache dirs ──"
                du -sh ~/.npm 2>/dev/null || true
                du -sh ~/.cache 2>/dev/null || true
                du -sh ~/.pm2/logs/ 2>/dev/null || true
                du -sh /tmp 2>/dev/null || true
                echo
                echo "── git pack files (in case repo is bloated) ──"
                du -sh .git 2>/dev/null || true
                ;;
              free-disk)
                echo "── df -h BEFORE ──"
                df -h server/data/ || true
                echo
                echo "── Removing known-safe junk ──"

                # Old classifier/debug logs in server/data
                ls -lh server/data/classify*.log 2>/dev/null || echo "(no classify logs)"
                rm -f server/data/classify*.log

                # Stale blockfile artifacts (regeneratable)
                ls -lh server/data/blockfile-* 2>/dev/null | head -10 || echo "(no blockfile artifacts)"
                rm -f server/data/blockfile-corpus.jsonl
                # Keep manifest + analysis (small, occasionally referenced)

                # Old DB backups from prior migrations
                ls -lh server/data/library.db.bak-* 2>/dev/null || echo "(no .bak files)"
                # Conservative: only delete .bak older than 14 days
                find server/data/ -maxdepth 1 -name 'library.db.bak-*' -mtime +14 -print -delete 2>/dev/null || true

                # Any leftover vacuum-new (defense in depth)
                rm -f server/data/library.db.vacuum-new

                # Rotated pm2 logs older than 14 days
                find ~/.pm2/logs/ -name '*.log.gz' -mtime +14 -print -delete 2>/dev/null || true
                find ~/.pm2/logs/ -name '*__*' -mtime +14 -print -delete 2>/dev/null || true

                # npm cache (rebuilt on next install)
                npm cache clean --force 2>/dev/null || true

                # /tmp items >7 days old
                find /tmp -maxdepth 2 -mtime +7 -print -delete 2>/dev/null | head -20 || true

                echo
                echo "── df -h AFTER ──"
                df -h server/data/ || true
                ;;
              *) echo "Unknown step: $STEP"; exit 1 ;;
            esac

            echo "── Migration complete; restarting pm2 so prepared statements re-plan ──"
            pm2 restart ${{ secrets.PM2_PROCESS_NAME }} --update-env || true
            echo "── Done ──"
